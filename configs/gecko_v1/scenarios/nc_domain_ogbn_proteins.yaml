benchmark_name: UEFA
benchmark_schema_version: 2
seed: 0
benchmark_seeds: [0, 1, 2, 3, 4]
output_root: generated_streams
scenario:
  dataset: ogbn-proteins
  problem: NC
  incremental_setting: domain
  num_tasks: 8
  metrics: [rocauc]
  target_type: multi_label
  domain_constructor: species
  split_protocol: uefa_within_domain
  feature_provenance: strict_local_derived
partition:
  num_clients: 10
  spatial_profile: mild
  micro_partition_multiplier: 100
  client_size_tolerance: 0.20
  minimum_train_queries_per_client_task: 5
  minimum_validation_queries_per_client_task: 1
  minimum_test_queries_per_client_task: 1
  maximum_assignment_iterations: 500
  allow_infeasible: false
order: {profile: mild}
training:
  participation_fraction: 0.5
  rounds_per_stage: 10
  local_epochs_per_round: 1
  learning_rate: 0.01
  optimizer_state_across_rounds: reset
  aggregation_weight: current_supervised_query_count
  fedprox_mu: 0.01
  hidden_size: 256
  num_layers: 3
wandb: {mode: disabled, project: UEFA}
